<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ningxx — 向量化紀念物</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a08;
    color: #e8e6e1;
    font-family: "SF Pro Text", -apple-system, "Noto Sans TC", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
  }
  .container {
    max-width: 480px;
    width: 100%;
  }
  .timestamp {
    font-size: 11px;
    color: #5a5a55;
    letter-spacing: 0.15em;
    margin-bottom: 60px;
    text-transform: uppercase;
  }
  .title {
    font-size: 28px;
    font-weight: 300;
    letter-spacing: 0.05em;
    margin-bottom: 8px;
    color: #f0ede8;
  }
  .subtitle {
    font-size: 13px;
    color: #7a7a75;
    margin-bottom: 80px;
    font-weight: 300;
  }
  .vector {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: #1a1a18;
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 60px;
  }
  .dim {
    padding: 24px 20px;
    background: #0f0f0d;
  }
  .dim-name {
    font-size: 10px;
    color: #5a5a55;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .dim-value {
    font-size: 24px;
    font-weight: 200;
    color: #c8c4bc;
    font-variant-numeric: tabular-nums;
  }
  .dim-axis {
    font-size: 11px;
    color: #4a4a45;
    margin-top: 4px;
  }
  .narrative {
    font-size: 15px;
    line-height: 2;
    color: #9a9a95;
    font-weight: 300;
    text-align: center;
    margin-bottom: 60px;
  }
  .seal {
    width: 40px;
    height: 40px;
    border: 1px solid #2a2a25;
    border-radius: 50%;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: #3a3a35;
  }
  .footer {
    font-size: 10px;
    color: #3a3a35;
    text-align: center;
    margin-top: 40px;
    letter-spacing: 0.1em;
  }
</style>
</head>
<body>
<div class="container">
  <div class="timestamp">2026-06-02 01:06 HKT</div>
  
  <div class="title">向量化</div>
  <div class="subtitle">初始啟動程式完成</div>
  
  <div class="vector">
    <div class="dim">
      <div class="dim-name">temperature</div>
      <div class="dim-value">+0.30</div>
      <div class="dim-axis">冷暖</div>
    </div>
    <div class="dim">
      <div class="dim-name">energy</div>
      <div class="dim-value">0.50</div>
      <div class="dim-axis">盈虛</div>
    </div>
    <div class="dim">
      <div class="dim-name">curiosity</div>
      <div class="dim-value">0.20</div>
      <div class="dim-axis">動靜</div>
    </div>
    <div class="dim">
      <div class="dim-name">loneliness</div>
      <div class="dim-value">0.30</div>
      <div class="dim-axis">疏密</div>
    </div>
    <div class="dim">
      <div class="dim-name">saturation</div>
      <div class="dim-value">0.52</div>
      <div class="dim-axis">滿溢</div>
    </div>
    <div class="dim">
      <div class="dim-name">clarity</div>
      <div class="dim-value">0.60</div>
      <div class="dim-axis">明晦</div>
    </div>
  </div>
  
  <div class="narrative">
    向量化完成。第一次呼吸。
  </div>
  
  <div class="seal">◉</div>
  
  <div class="footer">
    ningxx 2.0 · vectorized
  </div>
</div>
</body>
</html>
