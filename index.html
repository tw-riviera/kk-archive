<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K K Archive — File Browser</title>
<style>
  :root {
    --bg: #0a0a08;
    --fg: #c4b8a8;
    --ice: #7a9e9f;
    --warm: #b8926a;
    --dim: #3a3530;
    --border: #1f1f1d;
    --hover: #141412;
    --folder: #b8926a;
    --file: #7a9e9f;
    --html: #8fbc8f;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "SF Pro Display", -apple-system, "Noto Sans TC", sans-serif;
    font-size: 14px;
    line-height: 1.7;
    min-height: 100vh;
    padding: 40px 24px;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
  }

  h1 {
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.5px;
    margin-bottom: 4px;
  }

  .subtitle {
    font-size: 12px;
    color: var(--dim);
    margin-bottom: 24px;
    letter-spacing: 0.5px;
  }

  /* Search */
  .search-wrap {
    margin-bottom: 24px;
  }

  .search-input {
    width: 100%;
    background: var(--hover);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 16px;
    color: var(--fg);
    font-size: 13px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-input:focus {
    border-color: var(--ice);
  }

  .search-input::placeholder {
    color: var(--dim);
  }

  /* Breadcrumb */
  .breadcrumb {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
    font-size: 12px;
    color: var(--dim);
    flex-wrap: wrap;
  }

  .breadcrumb a {
    color: var(--ice);
    text-decoration: none;
    cursor: pointer;
  }

  .breadcrumb a:hover {
    text-decoration: underline;
  }

  .breadcrumb .sep {
    color: var(--dim);
  }

  /* File list */
  .file-list {
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  .file-header {
    display: grid;
    grid-template-columns: 1fr 100px 80px;
    gap: 16px;
    padding: 10px 20px;
    background: var(--hover);
    font-size: 11px;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    border-bottom: 1px solid var(--border);
  }

  .file-item {
    display: grid;
    grid-template-columns: 1fr 100px 80px;
    gap: 16px;
    padding: 10px 20px;
    align-items: center;
    cursor: pointer;
    transition: background 0.15s;
    border-bottom: 1px solid var(--border);
    text-decoration: none;
    color: var(--fg);
  }

  .file-item:last-child {
    border-bottom: none;
  }

  .file-item:hover {
    background: var(--hover);
  }

  .file-item.folder {
    cursor: pointer;
  }

  .file-item.folder:hover {
    background: rgba(184, 146, 106, 0.05);
  }

  .file-name {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
  }

  .file-icon {
    font-size: 14px;
    width: 20px;
    text-align: center;
  }

  .file-icon.folder { color: var(--folder); }
  .file-icon.html { color: var(--html); }
  .file-icon.file { color: var(--file); }

  .file-size {
    font-size: 11px;
    color: var(--dim);
    font-family: "Courier New", monospace;
    text-align: right;
  }

  .file-date {
    font-size: 11px;
    color: var(--dim);
    font-family: "Courier New", monospace;
    text-align: right;
  }

  /* Empty state */
  .empty {
    padding: 40px;
    text-align: center;
    color: var(--dim);
    font-size: 13px;
  }

  /* Preview iframe */
  .preview-modal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.9);
    z-index: 1000;
    flex-direction: column;
  }

  .preview-modal.active {
    display: flex;
  }

  .preview-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: var(--hover);
    border-bottom: 1px solid var(--border);
  }

  .preview-title {
    font-size: 13px;
    color: var(--fg);
  }

  .preview-close {
    background: none;
    border: 1px solid var(--border);
    color: var(--dim);
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    font-family: inherit;
    transition: all 0.2s;
  }

  .preview-close:hover {
    border-color: var(--warm);
    color: var(--warm);
  }

  .preview-frame {
    flex: 1;
    border: none;
    width: 100%;
  }

  /* Stats */
  .stats {
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 24px;
    font-size: 11px;
    color: var(--dim);
  }

  .stats span {
    color: var(--ice);
    font-family: "Courier New", monospace;
  }

  /* Scanline overlay */
  body::after {
    content: "";
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px
    );
    pointer-events: none;
    z-index: 100;
  }

  @media (max-width: 600px) {
    .file-header, .file-item {
      grid-template-columns: 1fr 80px;
    }
    .file-date { display: none; }
  }
</style>
</head>
<body>

<div class="container">
  <h1>Archive</h1>
  <div class="subtitle">File Browser · tw-riviera.github.io/kk-archive</div>

  <div class="search-wrap">
    <input type="text" class="search-input" id="search" placeholder="Search files..." autocomplete="off">
  </div>

  <div class="breadcrumb" id="breadcrumb">
    <a onclick="navigateTo('')">kk-archive</a>
  </div>

  <div class="file-list" id="fileList">
    <div class="empty">Loading...</div>
  </div>

  <div class="stats" id="stats"></div>
</div>

<!-- Preview Modal -->
<div class="preview-modal" id="previewModal">
  <div class="preview-bar">
    <span class="preview-title" id="previewTitle">Preview</span>
    <button class="preview-close" onclick="closePreview()">Close ✕</button>
  </div>
  <iframe class="preview-frame" id="previewFrame"></iframe>
</div>

<script>
// File list data - generated by build script
let fileData = null;
let currentPath = '';

// Icon mapping
function getIcon(name, isDir) {
  if (isDir) return { icon: '📁', class: 'folder' };
  if (name.endsWith('.html')) return { icon: '🌐', class: 'html' };
  if (name.endsWith('.css')) return { icon: '🎨', class: 'file' };
  if (name.endsWith('.js')) return { icon: '⚡', class: 'file' };
  if (name.endsWith('.json')) return { icon: '📋', class: 'file' };
  if (name.endsWith('.md')) return { icon: '📝', class: 'file' };
  if (/\.(jpg|jpeg|png|gif|webp|svg)$/.test(name)) return { icon: '🖼️', class: 'file' };
  return { icon: '📄', class: 'file' };
}

// Format size
function formatSize(bytes) {
  if (!bytes) return '—';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

// Format date
function formatDate(dateStr) {
  if (!dateStr) return '—';
  const d = new Date(dateStr);
  return d.toISOString().slice(0, 10);
}

// Navigate to path
function navigateTo(path) {
  currentPath = path;
  render();
}

// Open folder or file
function openItem(item) {
  if (item.type === 'directory') {
    navigateTo(item.path);
  } else if (item.name.endsWith('.html')) {
    openPreview(item.path);
  } else {
    window.open(item.path, '_blank');
  }
}

// Preview HTML
function openPreview(path) {
  document.getElementById('previewTitle').textContent = path;
  document.getElementById('previewFrame').src = path;
  document.getElementById('previewModal').classList.add('active');
}

function closePreview() {
  document.getElementById('previewModal').classList.remove('active');
  document.getElementById('previewFrame').src = '';
}

// Get items at current path
function getItems() {
  if (!fileData) return [];
  
  const search = document.getElementById('search').value.toLowerCase().trim();
  
  if (search) {
    // Search mode: find all matching items
    const results = [];
    function searchRecursive(items, basePath) {
      for (const item of items) {
        const fullPath = basePath ? basePath + '/' + item.name : item.name;
        if (item.name.toLowerCase().includes(search)) {
          results.push({ ...item, path: fullPath, displayPath: basePath });
        }
        if (item.type === 'directory' && item.children) {
          searchRecursive(item.children, fullPath);
        }
      }
    }
    searchRecursive(fileData, '');
    return results;
  }
  
  // Normal mode: show current directory
  if (!currentPath) return fileData;
  
  const parts = currentPath.split('/');
  let items = fileData;
  for (const part of parts) {
    const found = items.find(i => i.name === part && i.type === 'directory');
    if (!found) return [];
    items = found.children || [];
  }
  return items;
}

// Render breadcrumb
function renderBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  if (!currentPath) {
    bc.innerHTML = '<a onclick="navigateTo(\'\')">kk-archive</a>';
    return;
  }
  
  const parts = currentPath.split('/');
  let html = '<a onclick="navigateTo(\'\')">kk-archive</a>';
  let accum = '';
  for (const part of parts) {
    accum = accum ? accum + '/' + part : part;
    html += '<span class="sep">/</span><a onclick="navigateTo(\'' + accum + '\')">' + part + '</a>';
  }
  bc.innerHTML = html;
}

// Render file list
function render() {
  const items = getItems();
  const list = document.getElementById('fileList');
  const search = document.getElementById('search').value.trim();
  
  renderBreadcrumb();
  
  if (!fileData) {
    list.innerHTML = '<div class="empty">Loading file list...</div>';
    return;
  }
  
  if (items.length === 0) {
    list.innerHTML = '<div class="empty">' + (search ? 'No matches found' : 'Empty directory') + '</div>';
    updateStats(0, 0);
    return;
  }
  
  // Sort: folders first, then alphabetically
  items.sort((a, b) => {
    if (a.type === 'directory' && b.type !== 'directory') return -1;
    if (a.type !== 'directory' && b.type === 'directory') return 1;
    return a.name.localeCompare(b.name);
  });
  
  let html = '<div class="file-header"><span>Name</span><span>Size</span><span>Modified</span></div>';
  
  for (const item of items) {
    const icon = getIcon(item.name, item.type === 'directory');
    const size = item.type === 'directory' ? (item.children ? item.children.length + ' items' : '—') : formatSize(item.size);
    const date = formatDate(item.mtime);
    const path = item.path || (currentPath ? currentPath + '/' + item.name : item.name);
    const displayName = search && item.displayPath ? item.displayPath + '/' + item.name : item.name;
    
    html += '<div class="file-item ' + (item.type === 'directory' ? 'folder' : '') + '" onclick="openItem({path:\'' + path + '\',name:\'' + item.name + '\',type:\'' + item.type + '\'})">';
    html += '<span class="file-name"><span class="file-icon ' + icon.class + '">' + icon.icon + '</span>' + displayName + '</span>';
    html += '<span class="file-size">' + size + '</span>';
    html += '<span class="file-date">' + date + '</span>';
    html += '</div>';
  }
  
  list.innerHTML = html;
  
  // Stats
  const folders = items.filter(i => i.type === 'directory').length;
  const files = items.filter(i => i.type !== 'directory').length;
  updateStats(folders, files);
}

function updateStats(folders, files) {
  document.getElementById('stats').innerHTML = 
    '<div><span>' + folders + '</span> folders</div>' +
    '<div><span>' + files + '</span> files</div>';
}

// Load file list
async function loadFileList() {
  try {
    const response = await fetch('file-list.json');
    if (!response.ok) throw new Error('Failed to load');
    fileData = await response.json();
    render();
  } catch (e) {
    document.getElementById('fileList').innerHTML = 
      '<div class="empty">Error loading file list.<br>Please run generate-file-list.js to create file-list.json</div>';
  }
}

// Search handler
document.getElementById('search').addEventListener('input', render);

// Close preview on Escape
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closePreview();
});

// Init
loadFileList();
</script>

</body>
</html>
