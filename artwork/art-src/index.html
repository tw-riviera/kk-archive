<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ART — INDEX</title>
<style>
  :root {
    --bg: #0a0a08;
    --text: #c9c5b8;
    --muted: #8b7d6b;
    --accent: #6b7d6b;
    --gold: #a68a64;
    --grid: rgba(139, 125, 107, 0.06);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "SF Mono", "Menlo", "Consolas", "Noto Sans TC", monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Layout: hard 55:45 split ── */
  .container {
    display: flex;
    width: 100vw;
    min-height: 100vh;
  }

  .left {
    width: 55vw;
    position: relative;
    display: flex;
    align-items: flex-end;
    padding: 8vh 4vw;
    background-image:
      linear-gradient(to right, var(--grid) 1px, transparent 1px),
      linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
    background-size: 80px 80px;
  }

  .left-inner {
    position: relative;
    z-index: 1;
  }

  .index-num {
    font-family: -apple-system, "Helvetica Neue", sans-serif;
    font-size: clamp(6rem, 14vw, 12rem);
    font-weight: 900;
    color: rgba(139, 125, 107, 0.12);
    line-height: 0.85;
    letter-spacing: -0.04em;
    position: absolute;
    bottom: 6vh;
    left: 4vw;
    user-select: none;
    pointer-events: none;
  }

  .index-label {
    font-size: 0.6rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 1.5rem;
  }

  .left-title {
    font-family: -apple-system, "Helvetica Neue", sans-serif;
    font-size: clamp(1.5rem, 2.5vw, 2.2rem);
    font-weight: 900;
    letter-spacing: 0.2em;
    color: var(--text);
    line-height: 1.3;
  }

  .left-title .vert {
    display: inline-block;
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-size: 1.15em;
    margin-left: 0.15em;
    color: var(--gold);
  }

  .right {
    width: 45vw;
    padding: 10vh 4vw 8vh 3vw;
    display: flex;
    flex-direction: column;
    justify-content: center;
    border-left: 1px solid rgba(139, 125, 107, 0.12);
  }

  /* ── TOC Entries ── */
  .toc-header {
    font-size: 0.6rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4vh;
    padding-bottom: 1.5vh;
    border-bottom: 1px solid rgba(139, 125, 107, 0.2);
  }

  .works {
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .work-item {
    display: block;
    text-decoration: none;
    color: inherit;
    padding: 2.5vh 0 2.5vh 0;
    border-bottom: 1px solid rgba(139, 125, 107, 0.1);
    transition: padding-left 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
  }

  .work-item::before {
    content: "";
    position: absolute;
    left: -1rem;
    top: 50%;
    transform: translateY(-50%);
    width: 3px;
    height: 0;
    background: var(--gold);
    transition: height 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .work-item:hover {
    padding-left: 1.2rem;
  }

  .work-item:hover::before {
    height: 60%;
  }

  .work-item:hover .work-title {
    color: var(--gold);
  }

  .work-title {
    font-family: -apple-system, "Helvetica Neue", sans-serif;
    font-size: 1.05rem;
    font-weight: 900;
    letter-spacing: 0.18em;
    color: var(--text);
    margin-bottom: 0.6rem;
    transition: color 0.3s ease;
  }

  .work-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem 1.4rem;
    font-size: 0.6rem;
    letter-spacing: 0.12em;
    color: var(--muted);
    line-height: 1.8;
  }

  .work-meta .key {
    color: var(--accent);
    text-transform: uppercase;
    min-width: 3.5rem;
    display: inline-block;
  }

  .work-meta .val {
    color: var(--muted);
  }

  /* ── Gallery Label Footer ── */
  .footer {
    margin-top: auto;
    padding-top: 6vh;
    border-top: 1px solid rgba(139, 125, 107, 0.15);
    font-size: 0.55rem;
    line-height: 2.2;
    color: var(--muted);
    letter-spacing: 0.12em;
  }

  .footer .row {
    display: flex;
    gap: 1rem;
  }

  .footer .key {
    color: var(--accent);
    min-width: 5rem;
    text-transform: uppercase;
  }

  /* ── Scanlines ── */
  .scanlines {
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 3px,
      rgba(0,0,0,0.06) 3px,
      rgba(0,0,0,0.06) 6px
    );
    pointer-events: none;
    z-index: 100;
  }

  /* ── Mobile ── */
  @media (max-width: 768px) {
    .container { flex-direction: column; }
    .left {
      width: 100vw;
      min-height: 35vh;
      padding: 6vh 6vw;
      border-bottom: 1px solid rgba(139, 125, 107, 0.12);
    }
    .index-num {
      font-size: 5rem;
      bottom: 3vh;
      right: 4vw;
      left: auto;
    }
    .right {
      width: 100vw;
      padding: 6vh 6vw 8vh;
      border-left: none;
    }
  }
</style>
</head>
<body>

<div class="scanlines"></div>

<div class="container">
  <section class="left">
    <div class="index-num">01</div>
    <div class="left-inner">
      <div class="index-label">Table of Contents</div>
      <h1 class="left-title">
827a<span class="vert">集</span></h1>
    </div>
  </section>

  <section class="right">
    <div class="toc-header">Works // chronological</div>

    <div class="works">
      <a class="work-item" href="codeless_port.html">
        <div class="work-title">無碼之港</div>
        <div class="work-meta">
          <span><span class="key">Date</span><span class="val">2026-05-20</span></span>
          <span><span class="key">Format</span><span class="val">HTML5 CANVAS</span></span>
          <span><span class="key">Ratio</span><span class="val">55:45 SPLIT</span></span>
          <span><span class="key">Palette</span><span class="val">MUTED EARTH-TONE</span></span>
          <span><span class="key">Session</span><span class="val">CODELESS_PORT_v1.0</span></span>
        </div>
      </a>
    </div>

    <div class="footer">
      <div class="row"><span class="key">Host</span><span class="val">HERMES AGENT // LOCAL DEPLOY</span></div>
      <div class="row"><span class="key">Path</span><span class="val">/opt/data/home/art/</span></div>
      <div class="row"><span class="key">Status</span><span class="val">DEPLOYED // LIVE</span></div>
    </div>
  </section>
</div>

</body>
</html>
