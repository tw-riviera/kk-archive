<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Grok 4.3 (beta) — Cosmic Weave</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background: #02020a;
    color: #a5b4fc;
    font-family: 'Inter', system-ui, sans-serif;
  }
  
  canvas {
    display: block;
    background: #02020a;
  }
  
  .overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    padding: 24px 32px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    z-index: 10;
  }
  
  .title {
    font-family: 'Space Grotesk', system_ui, sans-serif;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.03em;
    color: #c0c8ff;
    margin: 0;
  }
  
  .subtitle {
    font-size: 11px;
    opacity: 0.55;
    letter-spacing: 1.5px;
    margin-top: 4px;
  }
  
  .controls {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: rgba(10, 12, 30, 0.8);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(165, 180, 252, 0.2);
    border-radius: 16px;
    padding: 18px 22px;
    z-index: 20;
    min-width: 230px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  
  .control-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 10px;
  }
  
  .control-label {
    font-size: 11px;
    width: 95px;
    opacity: 0.7;
    flex-shrink: 0;
  }
  
  input[type="range"] {
    flex: 1;
    accent-color: #6366f1;
  }
  
  .btn {
    background: rgba(99, 102, 241, 0.15);
    border: 1px solid rgba(99, 102, 241, 0.35);
    color: #c0c8ff;
    padding: 7px 15px;
    border-radius: 8px;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.2s ease;
    font-weight: 500;
  }
  
  .btn:hover {
    background: rgba(99, 102, 241, 0.3);
  }
  
  .stats {
    position: fixed;
    bottom: 24px;
    left: 24px;
    font-size: 10px;
    opacity: 0.5;
    font-family: monospace;
    z-index: 10;
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="overlay">
  <div>
    <div class="title">GROK 4.3 <span style="font-size:13px;opacity:0.6;">β</span></div>
    <div class="subtitle">COSMIC WEAVE ENGINE</div>
  </div>
</div>

<div class="controls">
  <div class="control-row">
    <div class="control-label">TRAILS</div>
    <input type="range" id="trail" min="0.02" max="0.2" step="0.005" value="0.08">
  </div>
  <div class="control-row">
    <div class="control-label">GRAVITY</div>
    <input type="range" id="gravity" min="0.3" max="5" step="0.1" value="2.1">
  </div>
  <div class="control-row">
    <div class="control-label">LINK DISTANCE</div>
    <input type="range" id="connectDist" min="25" max="100" step="1" value="48">
  </div>
  
  <div style="display:flex; gap:8px; margin-top:8px;">
    <button class="btn" onclick="resetUniverse()">Reset</button>
    <button class="btn" onclick="bigBang()">Big Bang</button>
    <button class="btn" onclick="addBurst()">Burst</button>
    <button class="btn" onclick="toggleConnections()">Links</button>
  </div>
</div>

<div class="stats" id="stats"></div>

<script>
// ==================== GROK 4.3 COSMIC WEAVE (FIXED) ====================
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let width, height;
let particles = [];
let attractors = [];
let mouse = { x: 0, y: 0, down: false, strength: 1.2 };
let showConnections = true;
let frame = 0;

const MAX_PARTICLES = 2200;

function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
}

function createParticle(x = null, y = null, vx = null, vy = null) {
  const p = {};
  p.x = x !== null ? x : width/2 + (Math.random()-0.5) * width * 0.55;
  p.y = y !== null ? y : height/2 + (Math.random()-0.5) * height * 0.55;

  const angle = Math.atan2(p.y - height/2, p.x - width/2);
  const orbital = 0.9 + Math.random() * 1.3;

  p.vx = vx !== null ? vx : -Math.sin(angle) * orbital + (Math.random()-0.5)*0.5;
  p.vy = vy !== null ? vy :  Math.cos(angle) * orbital + (Math.random()-0.5)*0.5;

  p.size = Math.random() * 1.6 + 0.7;
  p.hue = 200 + Math.random() * 90;
  p.alpha = 0.5 + Math.random() * 0.5;
  p.life = 900 + Math.random() * 500;
  return p;
}

function initAttractors() {
  attractors = [
    { x: width/2, y: height/2, mass: 10, hue: 260, vx: 0, vy: 0 }, // Main core
    { x: width/2 + 280, y: height/2 - 60, mass: 2.6, hue: 195, vx: -1.4, vy: 1.1 },
    { x: width/2 - 220, y: height/2 + 180, mass: 1.7, hue: 305, vx: 1.0, vy: -0.9 }
  ];
}

function updateAttractors() {
  for (let i = 1; i < attractors.length; i++) {
    const a = attractors[i];
    a.x += a.vx;
    a.y += a.vy;

    // Gentle pull back toward center
    const dx = width/2 - a.x;
    const dy = height/2 - a.y;
    a.vx += dx * 0.0007;
    a.vy += dy * 0.0007;
  }
}

function resetUniverse() {
  particles = [];
  for (let i = 0; i < MAX_PARTICLES; i++) {
    particles.push(createParticle());
  }
  initAttractors();
}

function bigBang() {
  particles = [];
  const cx = width / 2;
  const cy = height / 2;

  for (let i = 0; i < MAX_PARTICLES; i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist = 20 + Math.random() * 160;
    const x = cx + Math.cos(angle) * dist;
    const y = cy + Math.sin(angle) * dist;
    const speed = 3 + Math.random() * 5;

    particles.push(createParticle(
      x, y,
      Math.cos(angle) * speed,
      Math.sin(angle) * speed
    ));
  }
}

function addBurst() {
  const bx = mouse.x || width/2;
  const by = mouse.y || height/2;

  for (let i = 0; i < 140; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1.8 + Math.random() * 5;
    const p = createParticle(bx, by);
    p.vx = Math.cos(angle) * speed;
    p.vy = Math.sin(angle) * speed;
    p.hue = 195 + Math.random() * 50;
    p.alpha = 0.95;
    particles.push(p);
  }
  while (particles.length > MAX_PARTICLES * 1.15) particles.shift();
}

function toggleConnections() {
  showConnections = !showConnections;
}

function updateParticles(gravity) {
  const cx = width / 2;
  const cy = height / 2;

  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    let fx = 0, fy = 0;

    // Gravity from attractors
    for (let a of attractors) {
      const dx = a.x - p.x;
      const dy = a.y - p.y;
      const distSq = dx*dx + dy*dy + 140;
      const dist = Math.sqrt(distSq);
      const force = (a.mass * gravity) / distSq;

      fx += (dx / dist) * force;
      fy += (dy / dist) * force;
    }

    // Gentle center pull
    const dxC = cx - p.x;
    const dyC = cy - p.y;
    const dC = Math.hypot(dxC, dyC) + 1;
    fx += (dxC / dC) * 0.015;
    fy += (dyC / dC) * 0.015;

    p.vx += fx;
    p.vy += fy;

    // Speed cap + drag
    const speed = Math.hypot(p.vx, p.vy);
    if (speed > 7.8) {
      p.vx = (p.vx / speed) * 7.8;
      p.vy = (p.vy / speed) * 7.8;
    }
    p.vx *= 0.994;
    p.vy *= 0.994;

    p.x += p.vx;
    p.y += p.vy;

    // Respawn escaped particles
    if (Math.hypot(p.x - cx, p.y - cy) > Math.max(width, height) * 0.9) {
      const np = createParticle();
      p.x = np.x; p.y = np.y;
      p.vx = np.vx * 0.7; p.vy = np.vy * 0.7;
    }

    p.life--;
    if (p.life <= 0) {
      const np = createParticle();
      p.x = np.x; p.y = np.y;
      p.vx = np.vx; p.vy = np.vy;
      p.life = 900 + Math.random()*500;
    }
  }
}

function drawEverything(time) {
  const trail = parseFloat(document.getElementById('trail').value);
  const connectDist = parseFloat(document.getElementById('connectDist').value);

  // Trail fade
  ctx.fillStyle = `rgba(3, 2, 16, ${trail})`;
  ctx.fillRect(0, 0, width, height);

  // Draw constellation links
  if (showConnections) {
    ctx.strokeStyle = 'rgba(170, 200, 255, 0.07)';
    ctx.lineWidth = 0.7;

    for (let i = 0; i < particles.length; i += 2) {
      const p1 = particles[i];
      for (let j = i + 1; j < particles.length; j += 3) {
        const p2 = particles[j];
        const d = Math.hypot(p1.x - p2.x, p1.y - p2.y);
        if (d < connectDist && d > 10) {
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
        }
      }
    }
  }

  // Draw particles
  for (let p of particles) {
    ctx.fillStyle = `hsla(${p.hue}, 90%, 78%, ${p.alpha})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }

  // Draw attractors (glowing cores + rings)
  for (let i = 0; i < attractors.length; i++) {
    const a = attractors[i];

    // Glow
    const grad = ctx.createRadialGradient(a.x, a.y, 4, a.x, a.y, 60);
    grad.addColorStop(0, `hsla(${a.hue}, 100%, 90%, 0.95)`);
    grad.addColorStop(0.4, `hsla(${a.hue}, 100%, 75%, 0.3)`);
    grad.addColorStop(1, 'transparent');

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(a.x, a.y, 60, 0, Math.PI * 2);
    ctx.fill();

    // Core
    ctx.fillStyle = i === 0 ? '#fff' : `hsla(${a.hue}, 100%, 95%, 1)`;
    ctx.beginPath();
    ctx.arc(a.x, a.y, i === 0 ? 6 : 3.5, 0, Math.PI * 2);
    ctx.fill();

    // Rotating rings on main core
    if (i === 0) {
      ctx.strokeStyle = `hsla(${a.hue}, 85%, 82%, 0.4)`;
      ctx.lineWidth = 1.8;

      for (let r = 0; r < 3; r++) {
        const radius = 20 + r * 13;
        ctx.save();
        ctx.translate(a.x, a.y);
        ctx.rotate(time * (0.0009 + r * 0.00025));
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0.3, Math.PI * 1.7);
        ctx.stroke();
        ctx.restore();
      }
    }
  }
}

function animate() {
  frame++;
  const time = Date.now();

  updateAttractors();
  const gravity = parseFloat(document.getElementById('gravity').value);
  updateParticles(gravity);

  // Mouse influence
  if (mouse.down) {
    for (let p of particles) {
      const dx = mouse.x - p.x;
      const dy = mouse.y - p.y;
      const dist = Math.hypot(dx, dy) + 1;
      const force = (mouse.strength * 320) / (dist * dist);
      p.vx += (dx / dist) * force;
      p.vy += (dy / dist) * force;
    }
  }

  drawEverything(time);

  // Occasional micro activity
  if (frame % 320 === 0 && Math.random() < 0.35) {
    const p = particles[Math.floor(Math.random() * particles.length)];
    if (p) {
      for (let k = 0; k < 10; k++) {
        const np = createParticle(p.x, p.y);
        np.vx *= 2.2; np.vy *= 2.2;
        particles.push(np);
      }
    }
  }

  while (particles.length > MAX_PARTICLES) particles.shift();

  if (frame % 25 === 0) {
    document.getElementById('stats').textContent = 
      `${particles.length} particles • ${attractors.length} cores`;
  }

  requestAnimationFrame(animate);
}

function setupEvents() {
  window.addEventListener('resize', resize);

  canvas.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });

  canvas.addEventListener('mousedown', e => {
    mouse.down = true;
    mouse.strength = (e.button === 2) ? -3.2 : 2.6;
  });

  window.addEventListener('mouseup', () => {
    mouse.down = false;
    mouse.strength = 1.2;
  });

  canvas.addEventListener('click', e => {
    for (let i = 0; i < 55; i++) {
      const angle = Math.random() * Math.PI * 2;
      const p = createParticle(e.clientX, e.clientY);
      p.vx = Math.cos(angle) * (1.5 + Math.random()*3);
      p.vy = Math.sin(angle) * (1.5 + Math.random()*3);
      particles.push(p);
    }
  });

  canvas.addEventListener('contextmenu', e => e.preventDefault());

  window.addEventListener('keydown', e => {
    if (e.key.toLowerCase() === 'r') resetUniverse();
    if (e.key === ' ') { e.preventDefault(); addBurst(); }
    if (e.key.toLowerCase() === 'b') bigBang();
    if (e.key.toLowerCase() === 'c') toggleConnections();
  });
}

function start() {
  resize();

  // Initial dark background
  ctx.fillStyle = '#02020a';
  ctx.fillRect(0, 0, width, height);

  initAttractors();
  resetUniverse();
  setupEvents();

  // Start centered
  mouse.x = width * 0.5;
  mouse.y = height * 0.48;

  animate();

  // Welcome burst
  setTimeout(() => {
    const cx = width/2, cy = height/2;
    for (let i = 0; i < 70; i++) {
      const angle = (i / 70) * Math.PI * 2;
      const p = createParticle(cx, cy);
      p.vx = Math.cos(angle) * 3.2;
      p.vy = Math.sin(angle) * 3.2;
      p.hue = 210;
      particles.push(p);
    }
  }, 900);

  console.log('%c[Grok 4.3] Cosmic Weave fixed version initialized successfully.', 'color:#6366f1');
}

start();
</script>

</body>
</html>
