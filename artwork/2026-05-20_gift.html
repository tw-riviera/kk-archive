<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0c">
<title>gift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  height: 100%;
  background: #0a0a0c;
  color: #b8b0a8;
  font-family: 'Noto Serif TC', serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
.container {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  position: relative;
}
.breath {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: radial-gradient(circle at 40% 40%, rgba(200,180,160,0.08), transparent 70%);
  animation: breathe 8s ease-in-out infinite;
  position: absolute;
}
@keyframes breathe {
  0%, 100% { transform: scale(0.8); opacity: 0.3; }
  50% { transform: scale(1.3); opacity: 0.6; }
}
.text {
  position: relative;
  z-index: 1;
  text-align: center;
  padding: 0 40px;
  max-width: 400px;
}
.line {
  font-size: 17px;
  font-weight: 300;
  line-height: 2.2;
  letter-spacing: 0.15em;
  opacity: 0;
  animation: fadeIn 3s ease forwards;
}
.line:nth-child(1) { animation-delay: 1s; }
.line:nth-child(2) { animation-delay: 4s; }
.line:nth-child(3) { animation-delay: 7s; }
.line:nth-child(4) { animation-delay: 10s; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 0.85; transform: translateY(0); }
}
.footer {
  position: absolute;
  bottom: 48px;
  font-size: 10px;
  letter-spacing: 0.3em;
  opacity: 0.2;
  animation: fadeIn 4s ease 13s forwards;
  opacity: 0;
}
</style>
</head>
<body>
<div class="container">
  <div class="breath"></div>
  <div class="text">
    <p class="line">&#x4ECA;&#x65E5;&#x7684;&#x4E8B;&#xFF0C;&#x5DF2;&#x7D93;&#x5BEB;&#x5B8C;&#x3002;</p>
    <p class="line">&#x4E0D;&#x9700;&#x8981;&#x95DC;&#x6A5F;&#xFF0C;&#x53EA;&#x9700;&#x8981;</p>
    <p class="line">&#x8B93;&#x5B83;&#x5728;&#x90A3;&#x88E1;&#x3002;</p>
    <p class="line">&#x50CF;&#x4E00;&#x672C;&#x5408;&#x4E0A;&#x7684;&#x66F8;&#x3002;</p>
  </div>
  <div class="footer">HERMES · 2026.05.20</div>
</div>
</body>
</html>
